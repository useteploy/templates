app: wordpress
domain: {{domain}}
# PINNED, not floating — WordPress is the catalog's PHP surface with
# upstream PHP-version tags, so the PHP runtime is an operator decision,
# not a side effect of an app-image float. 2026-10-21: php8.5-apache at
# this digest ships PHP 8.5.12. To bump: pull the tag elsewhere, confirm
# `php -v` inside it, then pin the new digest here in the same change.
image: wordpress:php8.5-apache@sha256:574ea6f58239fba5fc95fe22e03683777259534498ab8e0ea3f6f176a9d620d1
port: 80
# Preserve uploads, plugins, themes and installation files across versions.
volumes:
  wordpress: /var/www/html
env:
  WORDPRESS_DB_HOST: wordpress-db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: {{db_password}}
accessories:
  db:
    image: mysql:8
    port: 3306
    env:
      MYSQL_ROOT_PASSWORD: generate
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: {{db_password}}
    volumes:
      data: /var/lib/mysql
