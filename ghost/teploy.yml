# Ghost — modern publishing: blog, memberships, built-in newsletter.
# MySQL 8 accessory; content (themes, images) lives in the ghost-content volume.
app: ghost
domain: {{domain}}
image: ghost:5-alpine
port: 2368
health:
  path: /
  timeout_seconds: 120
env:
  url: https://{{domain}}
  database__client: mysql
  database__connection__host: ghost-db
  database__connection__user: ghost
  database__connection__password: {{db_password}}
  database__connection__database: ghost
volumes:
  content: /var/lib/ghost/content
accessories:
  db:
    image: mysql:8
    port: 3306
    env:
      MYSQL_ROOT_PASSWORD: generate
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: {{db_password}}
    volumes:
      data: /var/lib/mysql
