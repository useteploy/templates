# Nextcloud — self-hosted files, sync, and sharing.
# First boot installs Nextcloud into the data volume (takes a minute or two).
# NEXTCLOUD_ADMIN_PASSWORD is generated at install and printed ONCE.
app: nextcloud
domain: {{domain}}
# PINNED, not floating — nextcloud:apache bundles its own PHP, and this
# digest ships PHP 8.5.12 (verified 2026-10-21, matching the catalog's
# PHP target). Floating `apache` would silently move the PHP runtime on
# app updates. Bump deliberately: check `php -v` in the new tag first.
image: nextcloud:apache@sha256:3f05f4d5eded9d3d029e617926500645cca6344710364737a374088f6811095a
port: 80
health:
  path: /status.php
  timeout_seconds: 240
env:
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: generate
  NEXTCLOUD_TRUSTED_DOMAINS: {{domain}}
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://{{domain}}
  POSTGRES_HOST: nextcloud-db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD: {{db_password}}
  REDIS_HOST: nextcloud-redis
volumes:
  data: /var/www/html
accessories:
  db:
    image: postgres:16
    port: 5432
    env:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: {{db_password}}
    volumes:
      data: /var/lib/postgresql/data
  redis:
    image: valkey/valkey:8
    port: 6379
