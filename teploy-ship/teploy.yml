# Teploy Ship — self-hosted coding agent (issues in, verified PRs out)
#
# One worker image, two processes: `web` (dashboard + webhook receivers) and
# `worker` (executes durable runs — needs the model + git credentials).
# PostgreSQL runs as an accessory on the shared `teploy` Docker bridge (alias
# `ship-postgres`), so web and worker share one store. The image is the
# official pgvector build of postgres 17, so the optional code-index
# embeddings (SHIP_EMBED_MODEL) work unchanged when enabled.
#
# No domain: `ingress: host` publishes the dashboard directly at
# <server-ip>:7460 on ALL host interfaces by default. Installing Tailscale
# or adding ordinary UFW rules does not make Docker-published ingress private.
# Before install, use a tested upstream/Docker-aware firewall boundary, or
# render a manifest and set an explicit loopback/Tailnet bind; see README.md.
#
# Install:
#   teploy template install teploy-ship --server <name> [--port 7460]
#
# One variable is prompted at install:
#   db_password          the PostgreSQL accessory password (keep it; a
#                        restore or a manual psql needs it)
#
# Three secrets are generated at install and printed ONCE (save them):
#   SHIP_WEB_TOKEN       dashboard login + API bearer
#   SHIP_WEBHOOK_SECRET  Forgejo/GitHub webhook HMAC
#   SHIP_SESSION_SECRET  signs dashboard sessions
#
# Then complete worker wiring with `teploy secret set` (cannot be generated —
# they are YOUR credentials):
#   SHIP_GIT_TOKENS={"https://git.example.com":"<deploy-token>"}   repos it may clone/push
#   ANTHROPIC_API_KEY=<key>     model credential, called directly. To route
#                               through teploy-gateway instead, set
#                               AI_GATEWAY_URL + AI_GATEWAY_KEY.
#   SHIP_SANDBOX_URL + SHIP_SANDBOX_TOKEN   only if you run the teploy-sandbox
#                               daemon; unset, the worker runs repo commands in
#                               its own container. Setting a URL without a token
#                               stops the worker on purpose. SHIP_SANDBOX_IMAGE
#                               should match your repositories' toolchains.
#
# Per-repo evidence (which test command / which Observe service belongs to
# which repo) is set AFTER install, on the running instance:
#   teploy-ship evidence set <owner/repo> --test-command "go test ./..."
app: ship
ingress: host
port: 7460
platform: linux/amd64
image: ghcr.io/useteploy/teploy-ship:stable
memory: 1g

processes:
  web: web --store postgres
  worker: worker --store postgres --interval 5

accessories:
  postgres:
    # PINNED, not :latest — a storage engine is the last thing that should
    # change underneath you unannounced. Bump deliberately (within-pg17
    # pgvector releases are low-risk; a pg major bump is an upgrade path,
    # pg_dump/restore, not a redeploy).
    image: pgvector/pgvector:0.8.0-pg17
    port: 5432
    # Cgroup cap — generous for Ship's volume; a postgres OOM-kill means
    # crash recovery on next start, so keep headroom rather than trim it.
    memory: 1g
    env:
      POSTGRES_DB: ship
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: "{{db_password}}"
    volumes:
      pgdata: /var/lib/postgresql/data

env:
  # The store DSN. The password rides PGPASSWORD (read by the same client
  # library) so URI delimiters in db_password cannot alter the connection's
  # authority — same posture as the lullmail template.
  NUCLEUS_URL: postgres://ship@ship-postgres:5432/ship?sslmode=disable
  PGPASSWORD: "{{db_password}}"
  SHIP_MODEL: anthropic/claude-sonnet-5
  SHIP_WEB_TOKEN: generate
  SHIP_WEBHOOK_SECRET: generate
  SHIP_SESSION_SECRET: generate
  # To route model calls through teploy-gateway (deployed as its own app)
  # instead of calling the provider directly, set both:
  # AI_GATEWAY_URL: http://ship-gateway:8089
  # AI_GATEWAY_KEY: <key>
  # Sandbox daemon (optional) — e.g. the docker bridge gateway:
  # SHIP_SANDBOX_URL: http://172.18.0.1:7439
  # SHIP_SANDBOX_IMAGE: golang:1.24
  # SHIP_SANDBOX_NETWORK: egress

volumes:
  ship-data: /data
