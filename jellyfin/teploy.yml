# Jellyfin — free software media server (movies, TV, music).
# Media lives in the named docker volume `jellyfin-media`; copy files in with
# `docker cp` or point a syncthing/rsync job at it. See README.md.
app: jellyfin
domain: {{domain}}
image: jellyfin/jellyfin:latest
port: 8096
health:
  path: /health
  timeout_seconds: 90
volumes:
  config: /config
  cache: /cache
  media: /media
